<!doctype html>
<html>
    <head>
        <link rel="stylesheet" type="text/css" href="style.css">
        <meta charset="UTF-8">
        <title>The Blog</title>
    </head>
    <body>
        <header id="PageHeader">
            <div id="logo">
                <img src="the-blog.jpg" alt="Blog Logo" />
            </div>
            <div id="SiteTitleWrapper">
                <h1 id="SiteTitle">The Blog</h1>
            </div>
        </header>        

        <nav id="SiteNavigation">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>

        <main id="MainLayout">
            <section id="PageContent">
                <div id="main-image">Main Image</div>
                <div id="image-details">Image Details</div>
            </section>

            <aside id="Sidebar">
                <div id="image-thumbnails">
                    <div class="thumb">Thumb 1</div>
                    <div class="thumb">Thumb 2</div>
                    <div class="thumb">Thumb 3</div>
                    <div class="thumb">Thumb 4</div>
                </div>
                <div id="image-comment">Comment Box</div>
                <div id="image-comments">
                    <div class="comment">Comment 1</div>
                    <div class="comment">Comment 2</div>
                </div>
            </aside>
        </main>

        <footer id="PageFooter">
            <a href="#">Legal Stuff</a>
        </footer>
    </body>
</html>
